<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#17293c"/><meta name="app-build" content="dev"/><title>룬 영토 — Alpha 0.1</title>
<link rel="stylesheet" href="./style.css?v=0.1.52"/></head>
<body><main id="app"><div class="loading">룬 영토 불러오는 중…</div></main>
<script>
(function(){
  var here=document.querySelector('meta[name="app-build"]').content;
  function check(){
    fetch('./version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(raw){
      var v=(raw||'').trim();
      if(!v||v===here||here==='dev') return;
      var url=new URL(location.href);
      if(url.searchParams.get('b')===v) return;
      url.searchParams.set('b',v);
      if(window.runePendingBuild===v) return;
      window.runePendingBuild=v;
      window.dispatchEvent(new CustomEvent('rune-update',{detail:v}));
    }).catch(function(){});
  }
  check();
  setInterval(check,60000);
})();
</script>
<script type="module" src="./app.js?v=20261025-audio"></script></body></html>
